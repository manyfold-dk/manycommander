# cargo-about: the licences whose texts THIRD-PARTY-LICENSES may carry. The same list as
# the `[licenses] allow` of deny.toml, which decides what may enter the build.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "bzip2-1.0.6",
]
# The release binary's target. Build and dev dependencies do not end up in the binary.
targets = ["x86_64-unknown-linux-gnu"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# manycommander itself (publish = false) is not third-party: its licences are LICENSE-MIT and
# LICENSE-APACHE beside the notices.
private = { ignore = true }
