<text class="c4" x="530" y="315" textLength="20" lengthAdjust="spacingAndGlyphs">-&gt;</text>
<text class="c3" x="560" y="315" textLength="550" lengthAdjust="spacingAndGlyphs">rome-02.jpg                                          ok</text>
