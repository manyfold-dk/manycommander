<text class="c1" x="20" y="15" textLength="120" lengthAdjust="spacingAndGlyphs">Multi-rename</text>
<text class="c2" x="10" y="35" textLength="90" lengthAdjust="spacingAndGlyphs">Name mask</text>
<text class="c3" x="170" y="35" textLength="70" lengthAdjust="spacingAndGlyphs">[P]-[C]</text>
<text class="c3" x="10" y="55" textLength="190" lengthAdjust="spacingAndGlyphs">Extension mask  [E]</text>
<text class="c3" x="10" y="75" textLength="60" lengthAdjust="spacingAndGlyphs">Search</text>
<text class="c3" x="10" y="95" textLength="70" lengthAdjust="spacingAndGlyphs">Replace</text>
<text class="c3" x="10" y="115" textLength="360" lengthAdjust="spacingAndGlyphs">[ ] Regex (replace: $1..$9, ${name})</text>
<text class="c3" x="10" y="135" textLength="140" lengthAdjust="spacingAndGlyphs">[ ] Match case</text>
<text class="c3" x="10" y="155" textLength="620" lengthAdjust="spacingAndGlyphs">Case            ( ) unchanged  (•) lower  ( ) upper  ( ) title</text>
<text class="c3" x="10" y="175" textLength="170" lengthAdjust="spacingAndGlyphs">Counter start   1</text>
<text class="c3" x="10" y="195" textLength="170" lengthAdjust="spacingAndGlyphs">Counter step    1</text>
<text class="c3" x="10" y="215" textLength="170" lengthAdjust="spacingAndGlyphs">Counter digits  2</text>
<text class="c4" x="10" y="235" textLength="670" lengthAdjust="spacingAndGlyphs">[N] name  [E] extension  [N2-5] [N2-] [N-3] characters  [C] counter</text>
<text class="c4" x="10" y="255" textLength="700" lengthAdjust="spacingAndGlyphs">[P] directory  [Y][M][D] [h][m][s] modified  [[ ]] brackets  PgUp/PgDn</text>
<text class="c5" x="10" y="275" textLength="600" lengthAdjust="spacingAndGlyphs">an entry outside the selection has this name: &quot;IMG_0414.JPG&quot;</text>
<text class="c3" x="10" y="295" textLength="120" lengthAdjust="spacingAndGlyphs">IMG_0412.JPG</text>
<text class="c4" x="530" y="295" textLength="20" lengthAdjust="spacingAndGlyphs">-&gt;</text>
<text class="c3" x="560" y="295" textLength="550" lengthAdjust="spacingAndGlyphs">rome-01.jpg                                          ok</text>
