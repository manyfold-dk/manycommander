<text class="c4" x="530" y="395" textLength="20" lengthAdjust="spacingAndGlyphs">-&gt;</text>
<text class="c3" x="560" y="395" textLength="550" lengthAdjust="spacingAndGlyphs">rome-06.jpg                                          ok</text>
<text class="c4" x="10" y="415" textLength="410" lengthAdjust="spacingAndGlyphs">Tab: next field   Enter: OK   Esc: cancel</text>
<text class="c1" x="0" y="455" textLength="240" lengthAdjust="spacingAndGlyphs">/home/you/Pictures/rome$</text>
<text class="c1" x="0" y="475" textLength="10" lengthAdjust="spacingAndGlyphs">1</text>
