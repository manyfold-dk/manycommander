<text class="c4" x="630" y="175" textLength="70" lengthAdjust="spacingAndGlyphs"># Notes</text>
<text class="c4" x="630" y="215" textLength="120" lengthAdjust="spacingAndGlyphs">## This week</text>
<text class="c4" x="630" y="235" textLength="460" lengthAdjust="spacingAndGlyphs">- Send invoice 0917 and the quote for October.</text>
<text class="c4" x="630" y="255" textLength="350" lengthAdjust="spacingAndGlyphs">- Renew the domain before the 12th.</text>
<text class="c4" x="630" y="275" textLength="360" lengthAdjust="spacingAndGlyphs">- Back up ~/Pictures to /mnt/backup.</text>
<text class="c4" x="630" y="295" textLength="500" lengthAdjust="spacingAndGlyphs">- Walk the wallpapers with the quick view: Ctrl+Q.</text>
<text class="c4" x="630" y="335" textLength="100" lengthAdjust="spacingAndGlyphs">## Reading</text>
<text class="c4" x="630" y="355" textLength="420" lengthAdjust="spacingAndGlyphs">- The freedesktop.org trash specification.</text>
<text class="c4" x="630" y="375" textLength="440" lengthAdjust="spacingAndGlyphs">- SFTP draft 02: what version 3 leaves open.</text>
<text class="c4" x="630" y="415" textLength="110" lengthAdjust="spacingAndGlyphs">## Shopping</text>
<text class="c0" x="20" y="435" textLength="220" lengthAdjust="spacingAndGlyphs">6 entries, 312.0G free</text>
