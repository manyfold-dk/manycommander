# The manycommander.app site. Build: scripts/site.sh build (or `zola build` in this directory).
base_url = "https://manycommander.app"
title = "manycommander"
description = "A dual-pane, keyboard-driven terminal file manager for Omarchy. Two panels, the F-key verbs, live Omarchy theming, archives, image previews and SFTP, and copies that never leave a half-written file on ext4, btrfs or xfs."
default_language = "en"

compile_sass = false
minify_html = false
build_search_index = false
generate_feeds = false
generate_sitemap = true
generate_robots_txt = true

[markdown]
smart_punctuation = false
insert_anchor_links = "none"
external_links_no_referrer = true

[extra]
repo = "https://github.com/manyfold-dk/manycommander"
releases = "https://github.com/manyfold-dk/manycommander/releases/latest"
# The release install, on the start page and the install page (content is a Tera template).
# It finds the latest release when it runs, so no version is written here.
install_release = '''
tag=$(curl -sSfLI -o /dev/null -w '%{url_effective}' \
  https://github.com/manyfold-dk/manycommander/releases/latest)
tag=${tag##*/}
name=manycommander-${tag#v}-x86_64-linux
base=https://github.com/manyfold-dk/manycommander/releases/download/$tag
curl -sSfLO "$base/$name.tar.gz" -O "$base/$name.tar.gz.sha256"
sha256sum -c "$name.tar.gz.sha256" && tar -xzf "$name.tar.gz" &&
  install -Dm755 "$name/manycommander" ~/.local/bin/manycommander'''
# A build of main from source, for those with a Rust toolchain.
install = "cargo install --git https://github.com/manyfold-dk/manycommander --root ~/.local"
# The themes shown in the hero before a visitor picks one: Omarchy's default dark theme, and
# the light theme used when the browser prefers light.
theme_dark = "tokyo-night"
theme_light = "catppuccin-latte"
# The screenshot's size in CSS pixels (the SVG viewBox), so the page reserves its space.
shot_width = 1240
shot_height = 480
