# The manycommander.app site. Build: scripts/site.sh build (or `zola build` in this directory).
base_url = "https://manycommander.app"
title = "manycommander"
description = "A dual-pane, keyboard-driven terminal file manager for Omarchy. Two panels, the F-key verbs, live Omarchy theming, archives, image previews and SFTP, and copies that never leave a half-written file on ext4, btrfs or xfs."
default_language = "en"

compile_sass = false
minify_html = false
build_search_index = false
generate_feeds = false
generate_sitemap = true
generate_robots_txt = true

[markdown]
smart_punctuation = false
insert_anchor_links = "none"
external_links_no_referrer = true

[extra]
repo = "https://github.com/manyfold-dk/manycommander"
releases = "https://github.com/manyfold-dk/manycommander/releases/latest"
# The release install, on the start page and the install page (content is a Tera template).
# It finds the latest release when it runs, so no version is written here.
install_release = '''
tag=$(curl -sSfLI -o /dev/null -w '%{url_effective}' \
  https://github.com/manyfold-dk/manycommander/releases/latest)
tag=${tag##*/}
name=manycommander-${tag#v}-x86_64-linux
base=https://github.com/manyfold-dk/manycommander/releases/download/$tag
curl -sSfLO "$base/$name.tar.gz" -O "$base/$name.tar.gz.sha256"
sha256sum -c "$name.tar.gz.sha256" && tar -xzf "$name.tar.gz" &&
  install -Dm755 "$name/manycommander" ~/.local/bin/manycommander'''
# A build of main from source, for those with a Rust toolchain.
install = "cargo install --git https://github.com/manyfold-dk/manycommander --root ~/.local"
# The themes shown in the hero before a visitor picks one: Omarchy's default dark theme, and
# the light theme used when the browser prefers light.
theme_dark = "tokyo-night"
theme_light = "catppuccin-latte"
# The screenshot's size in CSS pixels (the SVG viewBox), so the page reserves its space.
shot_width = 1240
shot_height = 480
# The themes the picker shows before "all themes" is opened.
featured_themes = ["tokyo-night", "catppuccin-latte", "gruvbox", "nord", "rose-pine", "kanagawa"]

# The hero's showcase: one button per view, every screenshot 1240 x 480. The first view has
# no src: it is the theme screenshot above, which follows the picked theme. The others are
# in Tokyo Night. Captions are HTML; anchor is appended to the doc link.
[[extra.showcase]]
id = "panels"
label = "panels"
src = ""
alt = ""
caption = "Two panels with tabs, marks, a command line and the F-key bar, in the Omarchy theme you run."
doc = "@/docs/keys.md"
anchor = ""
link = "The keymap"

[[extra.showcase]]
id = "quick-view"
label = "quick view"
src = "screens/quick-view.svg"
alt = "manycommander with ~/Pictures/wallpapers in the left panel and the cursor on alpine-lake.png; the right side is the quick view, with the picture of a mountain lake at dusk drawn in halfblocks"
caption = "<kbd>Ctrl+Q</kbd> turns the other panel into a quick view of the entry under the cursor: pictures through Kitty graphics, Sixel or halfblocks, and an info card for everything else."
doc = "@/docs/quick-view.md"
anchor = ""
link = "Quick view"

[[extra.showcase]]
id = "archives"
label = "archives"
src = "screens/archive.svg"
alt = "manycommander with the archive git-x86_64.pkg.tar.zst open at /usr/bin in the left panel: git and scalar are marked, and the footer says 2 marked, 6.7M, 9.7M unpacked"
caption = "<kbd>Enter</kbd> opens a zip, tar, <code>.pkg.tar.zst</code> or 7z archive as a read-only directory, and <kbd>F5</kbd> extracts what you mark."
doc = "@/docs/archives.md"
anchor = ""
link = "Archives"

[[extra.showcase]]
id = "sftp"
label = "sftp"
src = "screens/sftp.svg"
alt = "manycommander with sftp://user@example.org/srv/www in the left panel and the local build of the same site in the right panel"
caption = "<code>cd sftp://host/path</code> opens a server in a panel through your own <code>ssh</code> and its configuration. <kbd>F5</kbd> uploads and downloads."
doc = "@/docs/sftp.md"
anchor = ""
link = "SFTP"

[[extra.showcase]]
id = "find"
label = "find"
src = "screens/find.svg"
alt = "manycommander's results tab for a search of ~/Documents: seven PDF files that contain invoice, by their paths relative to ~/Documents"
caption = "<kbd>Alt+F7</kbd> searches names and contents on a parallel walk and opens the results in a tab that every verb works on."
doc = "@/docs/find-and-rename.md"
anchor = "#find-files-alt-f7"
link = "Find files"

[[extra.showcase]]
id = "rename"
label = "rename"
src = "screens/multi-rename.svg"
alt = "manycommander's multi-rename tool for six photos: with the mask [P]-[C], IMG_0412.JPG becomes rome-01.jpg, and one row says name exists"
caption = "<kbd>Ctrl+M</kbd> renames many files from a mask, with a live preview, a check for names that exist, and undo."
doc = "@/docs/find-and-rename.md"
anchor = "#multi-rename-ctrl-m"
link = "Multi-rename"
