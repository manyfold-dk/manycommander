[package]
name = "manycommander"
version = "0.1.0"
edition = "2024"
description = "Dual-pane, keyboard-driven terminal file manager for Omarchy"
license = "Apache-2.0"
repository = "https://github.com/manyfold-dk/manycommander"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "manycommander"
path = "src/main.rs"

[features]
# Deterministic fault injection in fsops (plan: Failpoints). Off in release builds.
failpoints = []

[dependencies]
rustix = { version = "1.1", features = ["fs", "process", "rand"] }

[dev-dependencies]
blake3 = "1.8"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"
