[package]
name = "manycommander"
version = "0.1.0"
edition = "2024"
description = "Dual-pane, keyboard-driven terminal file manager for Omarchy"
license = "Apache-2.0"
repository = "https://github.com/manyfold-dk/manycommander"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "manycommander"
path = "src/main.rs"

[features]
# Deterministic fault injection in fsops (plan: Failpoints). Off in release builds.
failpoints = []

[dependencies]
crossterm = "0.29"
inotify = { version = "0.11", default-features = false }
jiff = "0.2"
ratatui = "0.30"
rustix = { version = "1.1", features = ["event", "fs", "process", "rand"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
tracing = { version = "0.1", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }

[dev-dependencies]
blake3 = "1.8"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"
