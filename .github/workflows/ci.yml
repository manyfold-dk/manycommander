# scripts/check.sh ci: the local gate, with skips allowed. A test that needs btrfs, user
# namespaces or FUSE, which the runner lacks, prints SKIP and its reason. The publication gate
# here checks shapes and secret scanners only (--names none); the maintainer's pre-push hook
# runs scripts/check.sh full with the name list. Branches other than main run through pull
# requests.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
      - uses: manyfold-dk/estate-baseline/.github/actions/install-scanners@5f9eff40d640c577cdde625fbd1d83bb5bc95e4e
      - name: Install cargo-deny
        env:
          # Renovate bumps the version (.github/renovate.json); the SHA-256 of the musl
          # tarball moves with it by hand, and the check below fails until it does.
          CARGO_DENY_VERSION: "0.20.2"
          CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
        run: |
          set -euo pipefail
          name="cargo-deny-$CARGO_DENY_VERSION-x86_64-unknown-linux-musl"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$name.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/$CARGO_DENY_VERSION/$name.tar.gz"
          echo "$CARGO_DENY_SHA256  $RUNNER_TEMP/$name.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$name.tar.gz" -C "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/bin"
          install -m 755 "$RUNNER_TEMP/$name/cargo-deny" "$RUNNER_TEMP/bin/cargo-deny"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # The scanners above and the gate below come from the same estate-baseline commit;
      # Renovate moves both together.
      - name: Fetch the publication gate
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/estate-baseline"
          git init "$dir"
          git -C "$dir" fetch --depth 1 https://github.com/manyfold-dk/estate-baseline.git 5f9eff40d640c577cdde625fbd1d83bb5bc95e4e
          git -C "$dir" checkout --detach FETCH_HEAD
      # The SFTP tests run sshd -i as a ProxyCommand and sftp-server on pipes, as the runner
      # user; neither listens. Installing openssh-server enables the ssh service, so stop it.
      - name: Install sshd and sftp-server
        run: |
          set -euo pipefail
          if [ ! -x /usr/sbin/sshd ] || [ ! -x /usr/lib/openssh/sftp-server ]; then
            sudo apt-get update -q
            sudo apt-get install -y -q --no-install-recommends openssh-server
            sudo systemctl disable --now ssh.socket ssh.service || true
          fi
          ls -l /usr/sbin/sshd /usr/lib/openssh/sftp-server
      - name: scripts/check.sh ci
        env:
          ESTATE_ROOT: ${{ runner.temp }}
          MC_XDEV_DIR: /dev/shm/mc-xdev
        run: scripts/check.sh ci
      # The release ships THIRD-PARTY-LICENSES (ADR 0032). Writing it here fails a change that
      # adds a crate whose licence text cannot be found, long before a release would.
      - name: Third-party licence notices
        run: |
          scripts/notices.sh install "$RUNNER_TEMP/bin"
          CARGO_ABOUT="$RUNNER_TEMP/bin/cargo-about" scripts/notices.sh generate "$RUNNER_TEMP/THIRD-PARTY-LICENSES"
