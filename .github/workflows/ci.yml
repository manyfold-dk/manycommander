# T17: the local gate, with skips allowed. btrfs, user namespaces and FUSE belong to the
# development machine; a test that needs one prints SKIP and its reason. The publication
# gate here checks shapes and scanners only (--names none). The name list stays on the
# pre-push hook, which runs scripts/check.sh full.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
      - uses: manyfold-dk/estate-baseline/.github/actions/install-scanners@c30ee516e9c37625a16649359b6b350b0c81013f
      - name: Install cargo-deny 0.20.2
        run: |
          set -euo pipefail
          f="cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$f" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/$f"
          echo "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/bin"
          install -m 755 "$RUNNER_TEMP/cargo-deny-0.20.2-x86_64-unknown-linux-musl/cargo-deny" "$RUNNER_TEMP/bin/cargo-deny"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Fetch the publication gate
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/estate-baseline"
          git init "$dir"
          git -C "$dir" fetch --depth 1 https://github.com/manyfold-dk/estate-baseline.git c30ee516e9c37625a16649359b6b350b0c81013f
          git -C "$dir" checkout --detach FETCH_HEAD
      - name: scripts/check.sh ci
        env:
          ESTATE_ROOT: ${{ runner.temp }}
          MC_XDEV_DIR: /dev/shm/mc-xdev
        run: scripts/check.sh ci
