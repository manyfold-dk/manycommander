# Publish a GitHub release when a `vMAJOR.MINOR.PATCH` tag is pushed. The binary is built on
# GitHub's runner for x86_64-unknown-linux-gnu; the release notes are the tag's section of
# CHANGELOG.md. The tagged commit must be on main, and the ci workflow must have passed on it
# (docs/runbooks/release.md). The tarball carries a build provenance attestation, which mise
# checks on install and `gh attestation verify` checks by hand. After the release, the aur
# workflow builds the AUR package manycommander-bin from it, and pushes it when the repository
# variable AUR_PUBLISH is true (docs/runbooks/aur-package-setup.md).
#
# Two jobs, so that the code of the build never runs with the right to publish (ADR 0030):
# `build` compiles and packages with a read-only token, and `publish` attests and publishes
# what `build` made, running nothing from the repository. A run started by hand on main is a
# dry run: it builds and packages, and publishes nothing.
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      name: ${{ steps.package.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: The commit is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "$GITHUB_REF_NAME points at a commit that is not on main" >&2; exit 1; }
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: stable
      - name: The version, and for a tag that it matches Cargo.toml
        id: version
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)"
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build
        run: cargo build --release --locked
      - name: Package
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          name="manycommander-$VERSION-x86_64-linux"
          mkdir -p "dist/$name"
          install -m 755 target/release/manycommander "dist/$name/manycommander"
          strip "dist/$name/manycommander"
          cp LICENSE README.md CHANGELOG.md "dist/$name/"
          "dist/$name/manycommander" --version
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          awk -v v="$VERSION" '
            $0 ~ "^## \\[?" v "\\]?( |$)" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > dist/notes.md
          [ -s dist/notes.md ] || { echo "CHANGELOG.md has no section for $VERSION" >&2; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist/${{ steps.package.outputs.name }}.tar.gz
            dist/${{ steps.package.outputs.name }}.tar.gz.sha256
            dist/notes.md
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      NAME: ${{ needs.build.outputs.name }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - name: The tarball is the one build checksummed
        run: (cd dist && sha256sum -c "$NAME.tar.gz.sha256")
      - name: Build provenance attestation for the tarball
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/${{ needs.build.outputs.name }}.tar.gz
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/$NAME.tar.gz" "dist/$NAME.tar.gz.sha256" \
            --repo "$GITHUB_REPOSITORY" --title "manycommander $VERSION" \
            --notes-file dist/notes.md --verify-tag

  aur:
    needs: publish
    permissions:
      contents: read
    uses: ./.github/workflows/aur.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
